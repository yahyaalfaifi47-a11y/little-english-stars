<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little English Stars</title>
<meta name="theme-color" content="#2d6cdf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little English Stars">
<style>
html,body{margin:0;height:100%;background:#eaf3ff;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#cfe5ff,#fff4d6);transition:opacity .4s;z-index:5}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 8px 24px rgba(45,108,223,.3)}
#splash b{margin-top:14px;font-size:1.6rem;color:#4b2bb5}
#off{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:6;text-align:center;padding:24px}
#off button{margin-top:14px;padding:12px 24px;border:0;border-radius:99px;background:#2d6cdf;color:#fff;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>Little English Stars</b></div>
<div id="off"><h2>لا يوجد اتصال بالإنترنت</h2><p>تحقق من الاتصال ثم أعد المحاولة.</p><button onclick="location.reload()">إعادة المحاولة</button></div>
<iframe id="app" title="Little English Stars" allow="microphone; autoplay; clipboard-write; fullscreen"></iframe>
<script>
var APP='https://script.google.com/macros/s/AKfycbxFxePCEmIbQO7icT0nwfCQnxKLOESMBFLTjUtByNSmqqsej0iZnmYO4m9OObffzIDfEA/exec';
var f=document.getElementById('app'),sp=document.getElementById('splash'),off=document.getElementById('off');
function go(){
  if(!navigator.onLine){off.style.display='flex';sp.style.display='none';return}
  off.style.display='none';f.src=APP;
  f.onload=function(){sp.style.opacity='0';setTimeout(function(){sp.style.display='none'},450)};
  setTimeout(function(){sp.style.opacity='0';setTimeout(function(){sp.style.display='none'},450)},6000);
}
window.addEventListener('online',go);window.addEventListener('offline',function(){off.style.display='flex'});
go();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
